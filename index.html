<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>联通沃派 AI方向系统 15屏UI热点交互H5</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage" aria-label="联通沃派15屏UI热点交互H5">
      <section class="phone" id="phone">
        <div class="screen-stack" id="screenStack"></div>
        <div class="hotspot-layer" id="hotspotLayer" aria-label="UI可点击热点"></div>
      </section>
      <aside class="side-notes">
        <p class="eyebrow">WoPai UI Hotspot Prototype</p>
        <h1>直接点击 UI 进行跳转</h1>
        <p id="screenTitle">01 启动页</p>
        <div class="side-actions">
          <button class="ghost-btn" id="backBtn" type="button">返回上一页</button>
          <button class="ghost-btn" id="soundBtn" type="button" aria-pressed="true">音效 开</button>
          <button class="ghost-btn" id="debugBtn" type="button" aria-pressed="false">显示热点</button>
        </div>
        <p class="hint">点击画面中的真实 UI 元素，例如红色 CTA、功能卡片、底部导航、返回箭头和设置入口，即可模拟 App/H5 跳转。</p>
        <div class="mini-map" id="miniMap"></div>
      </aside>
    </main>
    <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
    <script src="./app.js"></script>
  </body>
</html>
